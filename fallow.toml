# fallow configuration for denext.
#
# denext is a Deno project: its dependencies live in `deno.json`'s import map as
# `npm:`/`jsr:` specifiers, NOT in a `package.json`. fallow's dependency analysis is
# package.json-oriented, so it reports these real, declared build dependencies as
# "unlisted" (and its dead-code pass runs with `dead_code_has_errors`). List them here
# so that false positive doesn't block the commit gate. Each IS declared in deno.json —
# verify against deno.json's `imports` before adding a new entry.
ignoreDependencies = [
  "@mdx-js/mdx", # deno.json: npm:@mdx-js/mdx@^3 — MDX compilation on the compat build
  "esbuild", # deno.json: npm:esbuild@^0.24.0 — the compat/SPA bundler
  "@std/http", # deno.json: jsr:@std/http@^1.0.0 — std HTTP (file-server, etc.)
]

# App Router route files (page/layout/route/…) are loaded by denext's FILE-BASED routing,
# not by any import, so fallow's reachability can't see them and reports them as "unused
# files". Declare the conventions as entry points so a legitimate new route/page (and its
# imports) is reachable and doesn't fail the gate.
entry = [
  "**/app/**/page.tsx",
  "**/app/**/layout.tsx",
  "**/app/**/route.ts",
  "**/app/**/loading.tsx",
  "**/app/**/error.tsx",
  "**/app/**/not-found.tsx",
  "**/app/**/template.tsx",
  "**/app/**/default.tsx",
  "**/app/**/global-error.tsx",
]

# The docs site (apps/web) is a satellite static-export app, not shipped framework code, and
# it is deliberately outside the test suite (its own deno.json, not a workspace member). So
# fallow's CRAP-on-zero-coverage penalizes its untested-by-design components/tree-walkers,
# which isn't a meaningful signal for a docs site. Exclude it from the framework's gate.
ignorePatterns = [
  "apps/web/**",
]
