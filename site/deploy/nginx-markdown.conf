# Markdown for agents — served from our own origin (no Cloudflare feature required).
#
# `deno task seo` writes a Markdown twin of every page into `out/`:
#   • <path>/index.md   — served at the SAME url via `Accept: text/markdown` (this config)
#   • <path>.md         — the append-.md convention, e.g. /docs/routing.md (plain static
#                         file; works with NO server config at all)
#
# Each .md is YAML frontmatter (title/description/url/image) + the page body as Markdown +
# any JSON-LD in ```json fences — the same shape Cloudflare's edge "markdown for agents"
# produces, so an agent that sends `Accept: text/markdown` gets identical results here.
#
# Drop this into the nginx that serves docs.denext.dev. Two pieces:

# ---- 1) in the top-level `http { }` block ---------------------------------------------
# Serve .md files as text/markdown, and flag requests that prefer markdown.
types {
    text/markdown  md;
}
map $http_accept $prefers_markdown {
    default            0;
    "~*text/markdown"  1;
}

# ---- 2) in the `server { }` block for docs.denext.dev ---------------------------------
# (root points at the exported `out/` directory)
#
# location / {
#     # When the client asked for markdown and a sibling .md exists, serve it at the
#     # same URL; otherwise fall through to the normal HTML. `$md` defaults to a path
#     # that never exists so non-markdown requests skip straight to the HTML.
#     set $md "/__no_md__";
#     if ($prefers_markdown) {
#         set $md "${uri}/index.md";
#     }
#     try_files $md $uri $uri/index.html $uri/ =404;
# }
#
# Notes:
#   • The append-.md URLs (/docs/routing.md) need none of the above — they are static
#     files already in `out/`, so they work the moment the site is deployed.
#   • charset: add `charset utf-8;` (or `charset_types text/markdown;`) if not already set.
