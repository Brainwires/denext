# Generated by `denext generate docker`.
# A self-hosted stack: copy .env.example to .env, fill in every secret, then
#   docker compose up -d --build
# Secrets come from .env (never commit it); a missing required one stops compose with a message.
# Development: docker compose -f docker-compose.yml -f compose.dev.yml up
services:
  web:
    build: .
    image: ${APP_IMAGE:-denext-app}
    restart: unless-stopped
    # SIGTERM drains in-flight requests (DENEXT_SHUTDOWN_DRAIN_MS, 10 s by default), then plugin
    # teardowns run; give both room before Docker's SIGKILL.
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    # start.tls: the certificate and key files, read-only (never baked into the image).
    volumes:
      - ./certs:/certs:ro
    # Anything else the app reads at runtime: put it in .env (optional file).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-denext_app}:${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}@db:5432/${POSTGRES_DB:-denext}
      DENEXT_ACTION_ID_SECRET: ${DENEXT_ACTION_ID_SECRET:-}
      DENEXT_CRASH_REPORT_URL: ${DENEXT_CRASH_REPORT_URL:-}
      SITE_CERT: ${SITE_CERT:?set it in .env (see .env.example)}
      SITE_KEY: ${SITE_KEY:?set it in .env (see .env.example)}
      ORG_CERT: ${ORG_CERT:?set it in .env (see .env.example)}
      ORG_KEY: ${ORG_KEY:?set it in .env (see .env.example)}
      DEFAULT_CERT: ${DEFAULT_CERT:?set it in .env (see .env.example)}
      DEFAULT_KEY: ${DEFAULT_KEY:?set it in .env (see .env.example)}
    healthcheck:
      test: ["CMD", "deno", "eval", "--unsafely-ignore-certificate-errors=localhost", "fetch('https://localhost:3000/_denext/health').then((r)=>Deno.exit(r.ok?0:1)).catch(()=>Deno.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # Applies pending migrations/*.sql (jobs/migrate.ts) once, then exits; the app waits for it.
  migrate:
    image: ${APP_IMAGE:-denext-app}
    pull_policy: never
    command: ["deno", "task", "migrate"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-denext_app}:${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}@db:5432/${POSTGRES_DB:-denext}
      DENEXT_ACTION_ID_SECRET: ${DENEXT_ACTION_ID_SECRET:-}
      DENEXT_CRASH_REPORT_URL: ${DENEXT_CRASH_REPORT_URL:-}
    depends_on:
      db-init:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-denext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-denext}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates (or updates) the app's own login role — the database's owner, never a superuser —
  # then exits; the app and the migrations connect as it.
  db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-denext}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      PGDATABASE: ${POSTGRES_DB:-denext}
      APP_USER: ${POSTGRES_APP_USER:-denext_app}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v u="$$APP_USER" -v p="$$APP_PASSWORD" -v d="$$PGDATABASE" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'u') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'u') \gexec
        ALTER ROLE :"u" WITH LOGIN CREATEROLE NOSUPERUSER PASSWORD :'p';
        ALTER DATABASE :"d" OWNER TO :"u";
        ALTER SCHEMA public OWNER TO :"u";
        SQL

  # The database dashboard (denext dashboard): tables and rows, the SQL editor, RLS policies,
  # migrations, storage, auth users and logs, behind DASHBOARD_PASSWORD (set it with
  # denext stack passwd --dashboard; without one it stays locked). Published on this machine's
  # loopback only (DASHBOARD_PORT moves it). To reach it from elsewhere, put a TLS reverse
  # proxy in front and add "--origin", "https://<its host>" to the command.
  dashboard:
    image: ${APP_IMAGE:-denext-app}
    pull_policy: never
    restart: unless-stopped
    command: ["deno", "run", "-A", "--config", "deno.json", "jsr:@denext/denext@^4.0.0/cli", "dashboard", "--host", "0.0.0.0", "--port", "3100"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3100}:3100"
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-denext_app}:${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}@db:5432/${POSTGRES_DB:-denext}
      DENEXT_ACTION_ID_SECRET: ${DENEXT_ACTION_ID_SECRET:-}
      DENEXT_CRASH_REPORT_URL: ${DENEXT_CRASH_REPORT_URL:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_APP_URL: http://web:3000
    healthcheck:
      test: ["CMD", "deno", "eval", "fetch('http://127.0.0.1:3100/login').then((r)=>Deno.exit(r.ok?0:1)).catch(()=>Deno.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  db-data:
