# Generated by `denext generate docker`.
# A self-hosted stack: copy .env.example to .env, fill in every secret, then
#   docker compose up -d --build
# Secrets come from .env (never commit it); a missing required one stops compose with a message.
# Development: docker compose -f docker-compose.yml -f compose.dev.yml up
services:
  web:
    build: .
    image: ${APP_IMAGE:-denext-app}
    restart: unless-stopped
    # SIGTERM drains in-flight requests (DENEXT_SHUTDOWN_DRAIN_MS, 10 s by default), then plugin
    # teardowns run; give both room before Docker's SIGKILL.
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    # Anything else the app reads at runtime: put it in .env (optional file).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-denext_app}:${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}@db:5432/${POSTGRES_DB:-denext}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-denext}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set it in .env (see .env.example)}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: ${S3_ENDPOINT:-http://minio:9000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-media}
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env (see .env.example)}
      DENEXT_ACTION_ID_SECRET: ${DENEXT_ACTION_ID_SECRET:-}
      DENEXT_PUBLISHABLE_KEY: ${DENEXT_PUBLISHABLE_KEY:-}
      DENEXT_SECRET_KEY: ${DENEXT_SECRET_KEY:-}
      DENEXT_JWT_SIGNING_KEYS: ${DENEXT_JWT_SIGNING_KEYS:-}
      DENEXT_JWT_SECRET: ${DENEXT_JWT_SECRET:-}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-}
      DENEXT_VAULT_KEY: ${DENEXT_VAULT_KEY:?set it in .env (see .env.example)}
      DENEXT_WEBHOOK_SECRET: ${DENEXT_WEBHOOK_SECRET:-}
      DENEXT_STORAGE_SECRET: ${DENEXT_STORAGE_SECRET:?set it in .env (see .env.example)}
      DENEXT_RATE_LIMIT_LOCAL_ADDRESSES: ${DENEXT_RATE_LIMIT_LOCAL_ADDRESSES:-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    healthcheck:
      test: ["CMD", "deno", "eval", "fetch('http://127.0.0.1:3000/_denext/health').then((r)=>Deno.exit(r.ok?0:1)).catch(()=>Deno.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # Applies @denext/backend's own migrations, then pending migrations/*.sql, once
  # (denext migration up), then exits; the app waits for it.
  migrate:
    image: ${APP_IMAGE:-denext-app}
    pull_policy: never
    command: ["deno", "run", "-A", "--config", "deno.json", "jsr:@denext/denext@^4.0.0/cli", "migration", "up"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-denext_app}:${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}@db:5432/${POSTGRES_DB:-denext}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-denext}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set it in .env (see .env.example)}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: ${S3_ENDPOINT:-http://minio:9000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-media}
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env (see .env.example)}
      DENEXT_ACTION_ID_SECRET: ${DENEXT_ACTION_ID_SECRET:-}
      DENEXT_PUBLISHABLE_KEY: ${DENEXT_PUBLISHABLE_KEY:-}
      DENEXT_SECRET_KEY: ${DENEXT_SECRET_KEY:-}
      DENEXT_JWT_SIGNING_KEYS: ${DENEXT_JWT_SIGNING_KEYS:-}
      DENEXT_JWT_SECRET: ${DENEXT_JWT_SECRET:-}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-}
      DENEXT_VAULT_KEY: ${DENEXT_VAULT_KEY:?set it in .env (see .env.example)}
      DENEXT_WEBHOOK_SECRET: ${DENEXT_WEBHOOK_SECRET:-}
      DENEXT_STORAGE_SECRET: ${DENEXT_STORAGE_SECRET:?set it in .env (see .env.example)}
      DENEXT_RATE_LIMIT_LOCAL_ADDRESSES: ${DENEXT_RATE_LIMIT_LOCAL_ADDRESSES:-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      db-init:
        condition: service_completed_successfully

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-denext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-denext}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates (or updates) the app's own login role — the database's owner, never a superuser —
  # then exits; the app and the migrations connect as it.
  db-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-denext}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      PGDATABASE: ${POSTGRES_DB:-denext}
      APP_USER: ${POSTGRES_APP_USER:-denext_app}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v u="$$APP_USER" -v p="$$APP_PASSWORD" -v d="$$PGDATABASE" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'u') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'u') \gexec
        ALTER ROLE :"u" WITH LOGIN CREATEROLE NOSUPERUSER REPLICATION PASSWORD :'p';
        ALTER DATABASE :"d" OWNER TO :"u";
        ALTER SCHEMA public OWNER TO :"u";
        CREATE EXTENSION IF NOT EXISTS vector;
        SQL

  # MinIO publishes no pullable images any more; this is Bitnami's legacy build of the same
  # server (with `mc`), pinned by digest. MINIO_IMAGE in .env swaps in any MinIO-compatible image.
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-denext}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set it in .env (see .env.example)}
    # Published on this machine's loopback only, so the presigned URLs S3_PUBLIC_ENDPOINT's
    # default signs (http://localhost:9000) work for a browser here. In production route a public
    # HTTPS hostname to it instead and set S3_PUBLIC_ENDPOINT to that.
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - storage-data:/bitnami/minio/data
    # Bitnami's entrypoint runs a setup server first, stops it and starts the real one: healthy
    # only once the setup is over (PID 1 is no longer entrypoint.sh), so nothing that waits for
    # it lands in the restart gap.
    healthcheck:
      test:
        - CMD-SHELL
        - "! grep -qx entrypoint.sh /proc/1/comm && curl -fsS http://127.0.0.1:9000/minio/health/live"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Creates the bucket once (idempotent), then exits; the app waits for it. The alias is retried
  # (a swapped-in image may not restart the way the health check expects).
  minio-init:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-denext}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set it in .env (see .env.example)}
      S3_BUCKET: ${S3_BUCKET:-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - for i in $$(seq 1 30); do mc alias set stack http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && break; sleep 2; done && mc mb --ignore-existing "stack/$$S3_BUCKET"

  # The database dashboard (denext dashboard): tables and rows, the SQL editor, RLS policies,
  # migrations, storage, auth users and logs, behind DASHBOARD_PASSWORD (set it with
  # denext stack passwd --dashboard; without one it stays locked). Published on this machine's
  # loopback only (DASHBOARD_PORT moves it). To reach it from elsewhere, put a TLS reverse
  # proxy in front and add "--origin", "https://<its host>" to the command.
  dashboard:
    image: ${APP_IMAGE:-denext-app}
    pull_policy: never
    restart: unless-stopped
    command: ["deno", "run", "-A", "--config", "deno.json", "jsr:@denext/denext@^4.0.0/cli", "dashboard", "--host", "0.0.0.0", "--port", "3100"]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3100}:3100"
    environment:
      DATABASE_URL: postgres://${POSTGRES_APP_USER:-denext_app}:${POSTGRES_APP_PASSWORD:?set it in .env (see .env.example)}@db:5432/${POSTGRES_DB:-denext}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-denext}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set it in .env (see .env.example)}
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: ${S3_ENDPOINT:-http://minio:9000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-media}
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env (see .env.example)}
      DENEXT_ACTION_ID_SECRET: ${DENEXT_ACTION_ID_SECRET:-}
      DENEXT_PUBLISHABLE_KEY: ${DENEXT_PUBLISHABLE_KEY:-}
      DENEXT_SECRET_KEY: ${DENEXT_SECRET_KEY:-}
      DENEXT_JWT_SIGNING_KEYS: ${DENEXT_JWT_SIGNING_KEYS:-}
      DENEXT_JWT_SECRET: ${DENEXT_JWT_SECRET:-}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-}
      DENEXT_VAULT_KEY: ${DENEXT_VAULT_KEY:?set it in .env (see .env.example)}
      DENEXT_WEBHOOK_SECRET: ${DENEXT_WEBHOOK_SECRET:-}
      DENEXT_STORAGE_SECRET: ${DENEXT_STORAGE_SECRET:?set it in .env (see .env.example)}
      DENEXT_RATE_LIMIT_LOCAL_ADDRESSES: ${DENEXT_RATE_LIMIT_LOCAL_ADDRESSES:-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_APP_URL: http://web:3000
      DASHBOARD_LOGS_URL: http://dashboard-logs:3101
    healthcheck:
      test: ["CMD", "deno", "eval", "fetch('http://127.0.0.1:3100/login').then((r)=>Deno.exit(r.ok?0:1)).catch(()=>Deno.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - default
      - dashboard-logs

  # Reads the stack's container logs for the dashboard's Logs page. The only service with the
  # Docker socket: it answers the dashboard alone (their own network, no published port) and
  # only two GETs: this project's services and their logs. It reads no other container's
  # settings and never runs or changes anything.
  dashboard-logs:
    image: ${APP_IMAGE:-denext-app}
    pull_policy: never
    restart: unless-stopped
    user: root
    command: ["deno", "run", "-A", "--config", "deno.json", "jsr:@denext/denext@^4.0.0/cli", "dashboard-logs", "--host", "0.0.0.0", "--port", "3101"]
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - dashboard-logs

volumes:
  db-data:
  storage-data:

networks:
  dashboard-logs:
    internal: true
