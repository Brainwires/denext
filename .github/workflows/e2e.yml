name: E2E (nightly)

# The headless-browser e2e suite (real Chromium via astral, plus next-compat tests
# that install real npm packages) is heavy and comparatively slow/flaky, so it is
# intentionally kept OFF the pull_request / push critical path. It runs on a nightly
# schedule and on manual dispatch instead — a failure here is visible on the nightly
# run without ever blocking a PR merge. The fast `check` + `integration` jobs in
# ci.yml gate PRs.
#
# Active development happens on `development` (the 2.0 line); `main` lags several rc
# releases behind. A `schedule` event always runs from the DEFAULT branch's workflow
# file and defaults to checking out that branch, so the nightly is pinned to check out
# `development` below — otherwise it would test stale `main`. `workflow_dispatch` still
# honors whatever ref you dispatch it against.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # Scheduled runs test `development` (active branch); a manual dispatch tests
          # whatever ref it was launched against.
          ref: ${{ github.event_name == 'schedule' && 'development' || github.ref }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6" # match ci.yml

      - name: Set up Node
        # Some e2e tests (tests/e2e/next-compat-*) install and bundle real npm React
        # packages, which needs a Node/npm toolchain available.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: E2E tests (headless Chromium via astral)
        # astral downloads a pinned Chromium on first run; the suite builds example
        # apps and drives hydration + next-compat pages in a real browser.
        run: deno task test:e2e

  # Migration beds: clone SHA-pinned real-world apps (tests/migration-bed/*.test.ts), run
  # `denext migrate` against this checkout, build, serve, and render-assert routes. Every
  # real-app migration so far found bugs by hand; this is that walk, nightly. A separate job
  # so a bed flake never masks a core e2e failure and each gets its own timeout. A clone or
  # dependency install that fails for network reasons SKIPS the bed; anything after it fails.
  # Add a bed: a new `tests/migration-bed/<app>.test.ts` describing the app as data and
  # calling `runBed` (see _bed.ts); bump a pin deliberately and say why in the commit.
  migration-beds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'development' || github.ref }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6" # match ci.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        # The beds install with the app's own package manager; the playground is a pnpm app.
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Migration beds
        run: deno task test:migration-bed
