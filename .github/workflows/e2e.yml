name: E2E

# The headless-browser e2e suite (real Chromium via astral, plus next-compat tests
# that install real npm packages) is heavy and comparatively slow/flaky, so it is
# intentionally kept OFF the pull_request / push critical path. There is no scheduled run:
# dispatch it by hand before a release (`gh workflow run e2e.yml --ref development`), so a
# failure here never blocks a PR merge. The fast `check` + `integration` jobs in ci.yml gate
# PRs. `workflow_dispatch` tests whatever ref you dispatch it against.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Run one job only (`gh workflow run e2e.yml -f job=migration-beds`), or all"
        type: choice
        default: all
        options: [all, e2e, migration-beds, timer-stress, no-deno]

permissions:
  contents: read

jobs:
  e2e:
    if: inputs.job == 'all' || inputs.job == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # match ci.yml

      - name: Set up Node
        # Some e2e tests (tests/e2e/next-compat-*) install and bundle real npm React
        # packages, which needs a Node/npm toolchain available.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Install Playwright's Chromium and WebKit
        # tests/e2e/spa-shell.e2e.test.ts drives both engines through playwright-core (pinned in
        # deno.json); under CI=1 it fails rather than skips when they are missing.
        run: deno run -A npm:playwright-core@1.63.0 install --with-deps chromium webkit

      - name: E2E tests (headless Chromium via astral)
        # astral downloads a pinned Chromium on first run; the suite builds example
        # apps and drives hydration + next-compat pages in a real browser.
        run: deno task test:e2e
        env:
          # examples/clerk's keyed e2e (tests/e2e/clerk.e2e.test.ts) runs against a Clerk
          # development instance only when these repository secrets exist; without them it is
          # skipped with a message. The test never prints them.
          CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
          CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}

  # Migration beds: clone SHA-pinned real-world apps (tests/migration-bed/*.test.ts), run
  # `denext migrate` against this checkout, build, serve, and render-assert routes. Every
  # real-app migration so far found bugs by hand; this is that walk, dispatched before a release. A separate job
  # so a bed flake never masks a core e2e failure and each gets its own timeout. A clone or
  # dependency install or post-migrate setup command that fails for network reasons SKIPS the
  # bed; `denext migrate`, the build, serving and the route assertions FAIL the job.
  # Add a bed: a new `tests/migration-bed/<app>.test.ts` describing the app as data and
  # calling `runBed` (see _bed.ts); bump a pin deliberately and say why in the commit.
  migration-beds:
    if: inputs.job == 'all' || inputs.job == 'migration-beds'
    runs-on: ubuntu-latest
    # Above one bed's summed step deadlines (~55 min for a full stall) so the harness's own
    # `[killed after …]` diagnostics print instead of the runner cutting the job first.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # match ci.yml

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up pnpm
        # The beds install with the app's own package manager; the playground is a pnpm app.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
          run_install: false

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Install Chromium's system libraries
        # A bed with a `browser` check (tests/migration-bed/_bed.ts) hydrates a page in headless
        # Chromium through astral, which downloads its own pinned Chromium but not the shared
        # libraries it links; this installs them (and Playwright's Chromium), as the e2e job does.
        run: deno run -A npm:playwright-core@1.63.0 install --with-deps chromium

      - name: Migration beds
        run: deno task test:migration-bed

  # Timer stress: the timer-heavy unit tests (client runtime, mobile, desktop, React Native, Expo,
  # VirtualList, navigation) under seeded timer jitter (`tests/stress/timer-jitter.ts`), several
  # runs with different seeds. A stall before timer and microtask callbacks imitates a loaded
  # machine, so a test that sleeps a fixed time instead of awaiting the work fails here rather
  # than once in a while on CI. The job summary lists each run's seed; replay a failed one with
  # `deno task test:stress --seed <seed>`.
  timer-stress:
    if: inputs.job == 'all' || inputs.job == 'timer-stress'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # match ci.yml

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Timer stress (10 seeded runs)
        run: deno task test:stress --runs 10

  # A machine with NO Deno, made to work by the `denext` executable alone: this checkout's binary
  # is compiled on the runner, then installed by scripts/install.sh (DENEXT_ARTIFACTS — the local
  # build, checksum-verified) inside a clean Debian container that has never had Deno. There it
  # scaffolds an app and runs `denext task dev`, `denext build` + `start`, `test`, `fmt`, `lint`
  # and `denext task build` with no `deno` anywhere (the installer's link opted out), checks the
  # one refusal when there is no toolchain either, then that the installer's default links `deno`
  # to the toolchain. The steps are scripts/ci/no-deno-e2e.sh.
  no-deno:
    if: inputs.job == 'all' || inputs.job == 'no-deno'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Deno (to compile the binary only; the container has none)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # match ci.yml

      - name: Build the denext binary as a local release
        run: |
          set -eu
          mkdir -p dist/no-deno
          deno compile -A --include src/cli/lazy-modules.generated.ts --output dist/denext cli.ts
          tar czf dist/no-deno/denext-x86_64-unknown-linux-gnu.tar.gz -C dist denext
          (cd dist/no-deno && sha256sum denext-x86_64-unknown-linux-gnu.tar.gz > SHA256SUMS)
          cp scripts/install.sh scripts/ci/no-deno-e2e.sh dist/no-deno/

      - name: Install and run an app in a container with no Deno
        run: |
          docker run --rm -v "$PWD/dist/no-deno:/art:ro" debian:bookworm-slim sh -c '
            apt-get update -qq && apt-get install -y -qq curl ca-certificates procps >/dev/null &&
            sh /art/no-deno-e2e.sh'
