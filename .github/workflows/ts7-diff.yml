name: TS7 diagnostic diff

# On-demand report: type-check the repo and its examples with the in-process TypeScript 6
# (`DENEXT_NATIVE_CHECK=0`) and with the toolchain's native TypeScript 7 (`DENEXT_NATIVE_CHECK=1`),
# and list the diagnostics that differ (scripts/ts7-diff.ts, `deno task ts7:diff`). Dispatch only:
# never on a push or a schedule. The report is the job summary and the `ts7-diff` artifact.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated targets (`.` = the repo, or examples/<name>); empty = the repo + every example"
        required: false
        default: ""
      fail_on_diff:
        description: "Fail the run when any target differs"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ts7-diff-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # Both compilers ship in the toolchain: TypeScript 6 in-process, TypeScript 7 beside it.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: Diff the diagnostics
        env:
          TARGETS: ${{ inputs.targets }}
          FAIL_ON_DIFF: ${{ inputs.fail_on_diff }}
        run: |
          flags="--out ts7-diff.md --json ts7-diff.json"
          if [ "$FAIL_ON_DIFF" = "true" ]; then flags="$flags --fail-on-diff"; fi
          # shellcheck disable=SC2086 # word splitting is intended: the targets and flags lists
          deno task ts7:diff $TARGETS $flags

      - name: Job summary
        if: always()
        run: if [ -f ts7-diff.md ]; then cat ts7-diff.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts7-diff
          path: |
            ts7-diff.md
            ts7-diff.json
          if-no-files-found: ignore
