# TEMPORARY (test/4-7-gaps only, removed before landing): publish.yml's `binaries` legs that
# cannot run their binary and its new `smoke` job, verbatim but for the trigger, the tag-only
# guards and the version (src/version.ts instead of the tag), so the smoke legs are proven on
# real ubuntu-24.04-arm / macos-latest runners without a tag.
name: TEMP binary smoke (publish.yml dry run)
on:
  push:
    branches: [test/4-7-gaps]
    paths: [
      ".github/workflows/tmp-binary-smoke.yml",
      ".github/workflows/publish.yml",
      "scripts/ci/binary-smoke.sh",
    ]
permissions:
  contents: read
concurrency:
  group: tmp-binary-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: v
        run: echo "v=$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' src/version.ts)" >> "$GITHUB_OUTPUT"
  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: ubuntu-latest, smoke: false }
          - { target: aarch64-apple-darwin, os: ubuntu-latest, smoke: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, smoke: false }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"

      - name: Compile
        run: |
          out=denext
          case "${{ matrix.target }}" in *windows*) out=denext.exe ;; esac
          # scripts/compile-cli.ts is the one `deno compile` of the CLI: it embeds the verbs (loaded
          # on demand through computed imports `deno compile` cannot see) and the framework files
          # the CLI reads at run time (deno.json, AGENTS.md).
          deno run -A scripts/compile-cli.ts --target ${{ matrix.target }} --output "$out"
          ls -lh "$out"

      # The binary has to RUN, not merely link (scripts/ci/binary-smoke.sh: --version, --help, a
      # lazily loaded verb, the unpinned-build refusal). The legs whose runner can't execute their
      # binary are run by the `smoke` job below, on their own OS and architecture.
      - name: Smoke-test the binary
        if: matrix.smoke
        run: sh scripts/ci/binary-smoke.sh ./denext "$VERSION"

      # The verbs that read framework files at run time, run by this very binary before it is
      # uploaded: `migrate --check` / `migrate` on a Next.js app, `create`, `generate`, `routes`,
      # `patch … denext`, `build` (on the denext just published) and the MCP server. 4.5.1 shipped
      # a binary without its deno.json, and `migrate` failed while every source-run test passed.
      - name: Smoke-test the binary's verbs
        if: matrix.smoke
        env:
          DENEXT_SMOKE_BINARY: ${{ github.workspace }}/denext
        run: deno test -A tests/integration/cli-binary-smoke.test.ts

      # Unsigned macOS binaries are quarantined by Gatekeeper on download. Signing needs an
      # Apple Developer ID; notarisation needs an App Store Connect key. Both are repository
      # secrets — when they are absent the step is skipped and the artifact ships unsigned,
      # which the install script and the docs call out. Signing runs on Linux with rcodesign
      # (apple-codesign, pinned by SHA-256), so the Mac legs need no macOS runner.
      # Every Mac binary is signed here, on Linux, with rcodesign (apple-codesign, pinned by
      # SHA-256). Without the Developer ID secrets the signature is ad-hoc — what `deno compile`
      # gives a Mac binary built on a Mac (Apple Silicon refuses to run an unsigned one, and
      # a cross-compiled x86_64 Mach-O comes out unsigned) — and Gatekeeper still quarantines
      # the download, which the install script strips and the docs call out. With them it is a
      # Developer ID signature with the hardened runtime, then notarised.
      - name: Sign (and notarise) the Mac binary
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERT: "" # TEMP: ad-hoc signing only
          APPLE_CERT_PASSWORD: "" # TEMP: ad-hoc signing only
          APPLE_API_KEY: "" # TEMP: ad-hoc signing only
          APPLE_API_KEY_ID: "" # TEMP: ad-hoc signing only
          APPLE_API_ISSUER: "" # TEMP: ad-hoc signing only
        run: |
          set -eu
          rcs=apple-codesign-0.29.0-x86_64-unknown-linux-musl
          curl -fsSLo rcs.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/$rcs.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rcs.tar.gz" | sha256sum -c -
          tar xzf rcs.tar.gz && rcodesign="$PWD/$rcs/rcodesign"
          # `secrets` is not a context a step-level `if` can read, so the guard lives here.
          if [ -z "${APPLE_CERT:-}" ]; then
            echo "denext: no Developer ID secrets — signing this binary ad-hoc" >&2
            "$rcodesign" sign denext
            rm -rf rcs.tar.gz "$rcs"
            exit 0
          fi
          echo "$APPLE_CERT" | base64 --decode > cert.p12
          printf '%s' "$APPLE_CERT_PASSWORD" > cert.pw
          # --for-notarization: the hardened runtime and a secure timestamp, as notarisation needs.
          # Under the hardened runtime V8 needs the JIT entitlement on Apple Silicon (it maps its
          # code space MAP_JIT): the same minimal set `denext build --compile --sign` grants
          # (COMPILE_ENTITLEMENTS in src/build/compile-sign.ts).
          cat > ents.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.cs.allow-jit</key><true/></dict></plist>
          PLIST
          "$rcodesign" sign --p12-file cert.p12 --p12-password-file cert.pw --for-notarization \
            --entitlements-xml-file ents.plist denext
          echo "$APPLE_API_KEY" | base64 --decode > key.p8
          "$rcodesign" encode-app-store-connect-api-key -o key.json \
            "$APPLE_API_ISSUER" "$APPLE_API_KEY_ID" key.p8
          zip -q denext.zip denext
          # A bare executable cannot be stapled (stapler takes .app/.dmg/.pkg only), so the
          # notarisation ticket is checked online by Gatekeeper on first run.
          "$rcodesign" notary-submit --api-key-file key.json --wait denext.zip
          rm -rf cert.p12 cert.pw key.p8 key.json ents.plist denext.zip rcs.tar.gz "$rcs"

      # Authenticode for the Windows binaries, cross-signed here on Linux with osslsigncode through
      # the same code path as `denext build --compile --sign` (scripts/ci/sign-binary.ts →
      # src/build/compile-sign.ts): SHA-256 and an RFC-3161 timestamp, the .pfx password read
      # from a 0600 file, never a command line. Without the certificate secrets the binary ships
      # unsigned (SmartScreen warns on first run), and the step says so in a notice.
      - name: Sign the Windows binary
        if: contains(matrix.target, 'windows')
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          DENEXT_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          set -eu
          # `secrets` is not a context a step-level `if` can read, so the guard lives here.
          if [ -z "${WINDOWS_CERT_PFX:-}" ]; then
            echo "::notice::denext: no Windows code-signing secrets — denext.exe for ${{ matrix.target }} ships unsigned"
            exit 0
          fi
          sudo apt-get install -y -qq osslsigncode >/dev/null
          umask 077
          cert="$RUNNER_TEMP/denext-codesign.pfx"
          trap 'rm -f "$cert"' EXIT
          echo "$WINDOWS_CERT_PFX" | base64 --decode > "$cert"
          DENEXT_WINDOWS_CERT="$cert" deno run -A scripts/ci/sign-binary.ts \
            --target ${{ matrix.target }} denext.exe

      # Asset names — the installers (scripts/install.sh, scripts/install.ps1) and the docs depend
      # on these exactly:
      #   denext-<target>.tar.gz          (denext-<target>.zip on Windows)
      #   denext-<target>.tar.gz.sha256   one `sha256sum`-format line for that archive
      # The release job concatenates the per-archive lines into a combined SHA256SUMS.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          name="denext-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *windows*) archive="$name.zip"; zip "dist/$archive" denext.exe ;;
            *) archive="$name.tar.gz"; tar czf "dist/$archive" denext ;;
          esac
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          cat "dist/$archive.sha256"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denext-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # The archives the build runner can't execute, run on their own OS before the release: aarch64
  # Linux on an Arm runner, and both Mac binaries on an Apple Silicon one (x86_64 under Rosetta).
  # The macOS leg puts a macOS runner on the release's path (one can queue for a while): the
  # price of never shipping a Mac binary no runner has executed. Each leg runs exactly what was
  # uploaded: the archive is checked against its .sha256 and
  # unpacked, then binary-smoke.sh runs and (on the native architecture) the verbs that read
  # framework files at run time (tests/integration/cli-binary-smoke.test.ts). A failure skips the
  # release, as a failed build leg does.
  smoke:
    needs: [version, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, targets: aarch64-unknown-linux-gnu }
          - { os: macos-latest, targets: aarch64-apple-darwin x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.v }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"

      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: denext-*-{linux-gnu,apple-darwin}
          path: dist
          merge-multiple: true

      - name: Smoke-test each binary
        run: |
          set -eu
          version="$VERSION"
          for t in ${{ matrix.targets }}; do
            (cd dist && shasum -a 256 -c "denext-$t.tar.gz.sha256")
            mkdir -p "bin/$t" && tar xzf "dist/denext-$t.tar.gz" -C "bin/$t"
            case "$t" in
              x86_64-apple-darwin)
                # Apple Silicon runs it under Rosetta: the same Mach-O a Mac with an Intel CPU runs.
                arch -x86_64 /usr/bin/true || { echo "::error::Rosetta is not installed"; exit 1; }
                printf '#!/bin/sh\nexec arch -x86_64 "%s" "$@"\n' "$PWD/bin/$t/denext" > "bin/$t/run"
                chmod +x "bin/$t/run"
                sh scripts/ci/binary-smoke.sh "bin/$t/run" "$version"
                ;;
              *) sh scripts/ci/binary-smoke.sh "bin/$t/denext" "$version" ;;
            esac
          done

      # The native-architecture binary's verbs (the first target of the leg).
      - name: Smoke-test the binary's verbs
        run: |
          set -eu
          t="$(echo "${{ matrix.targets }}" | cut -d' ' -f1)"
          DENEXT_SMOKE_BINARY="$PWD/bin/$t/denext" deno test -A tests/integration/cli-binary-smoke.test.ts
