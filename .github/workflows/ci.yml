name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check cli.ts mod.ts

      - name: Test
        run: deno test -A

      - name: Doc lint (JSR documentation coverage)
        run: deno doc --lint mod.ts src/server/mod.ts src/client/mod.ts src/jsx/jsx-runtime.ts src/lint/denext-plugin.ts
