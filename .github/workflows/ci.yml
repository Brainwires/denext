name: CI

# All work lands on `development` (see AGENTS.md → Releasing); `main` only ever receives the
# development → main merge PR at a release. Triggering on `main` alone meant an rc could be
# tagged from sixty commits none of which had been through CI. So every push to `development`
# runs the fast `check` job (and the `bundle-budget` and macOS `ios-export-router` jobs); the
# heavy jobs (integration builds, real-npm next-compat, the coverage re-run, the backend suites
# against real Postgres + MinIO, the unit + integration suites on Windows, the unit suite on
# macOS) run on pull requests, `main` and a manual dispatch, not on a plain push — a dozen pushes
# a day to the working branch would otherwise queue an hour of runners each.
#
# A release is cut from a commit these heavy jobs passed on: `deno task release` refuses to tag
# unless the newest ci.yml run on HEAD that ran them has every job green. On `development` that
# run is a dispatch: `gh workflow run ci.yml --ref development`, then `gh run watch`.
#
# A newer push to `development` cancels the push run before it; dispatch, `main` and PR runs are
# never cancelled (the event is part of the concurrency group, so a push never cancels a dispatch,
# such as the one a release is gated on).
#
# What runs on what. Users run denext's Deno toolchain (the pinned fork build,
# src/build/deno-toolchain-pin.json: its native TypeScript 7 checker, `Deno.SQL`, the Vitest API
# and fixes stock Deno lacks), so the tests and the type-check run on it too:
#   - stock Deno 2.9.6 (setup-deno): `deno fmt --check`, `deno lint` and `deno task doc-lint` in
#     `check` (reproducible formatting and lint; JSR scores what stock `deno publish` uploads), and
#     bootstrapping every job — it runs scripts/ci/toolchain-on-path.ts, after which each later
#     step's `deno` is the toolchain.
#   - the toolchain, put on PATH by that step: `check`'s `deno check` and unit suite,
#     `bundle-budget`, `integration`, `next-compat`, `ios-export-router`, `windows-tests`,
#     `macos-tests` and `windows-resolve`. scripts/test-run.ts runs every pass on the toolchain.
#   - `coverage`: stock Deno starts scripts/test-run.ts, which under `--coverage` runs every pass
#     (and `deno coverage`) on the toolchain it resolves the same way.
#   - `backend-integration`: the toolchain downloaded from its release URL and SHA-256 (pinned in
#     its env, kept equal to the pin by tests/deno-toolchain.test.ts).
#   - Stock Deno stays under test where it is meant to: the suites' `DENEXT_DENO=stock` cases
#     and the stock-Deno paths (npm:postgres via fromPostgresJs), and publishing (the release
#     script's `deno publish --dry-run`, publish.yml's `deno publish`).
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}

jobs:
  # Fast feedback: formatting, lint, type-check, the unit test suite, and doc
  # coverage. Excludes the heavy build/bundle integration tests (see the
  # `integration` job) so this job stays the short critical path.
  check:
    runs-on: ubuntu-latest
    # Every job has a limit (the default is 6 h, held by a stall). Sized from recent green runs:
    # check ≤ 15 min, integration / next-compat ≤ 3, coverage ≤ 52; about 3× / +40 min margin.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # stock, pinned for reproducible fmt/lint/doc-lint; bump deliberately and re-run `deno fmt`

      - name: Set up a JDK
        # The Android halves of the native templates are compiled with javac and run with java
        # (tests/_jdk.ts). Under CI those tests never skip: without a JDK they fail.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Default DENO_DIR on Linux; holds fetched JSR/npm deps + the wasm
          # packages. Keyed on deno.lock so the cache busts on any dep change.
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Read the Gleam pin
        # The unit suites that compile real Gleam (tests/gleam.test.ts, tests/migrate-lustre.test.ts)
        # run with denext's pinned Gleam, which `toolchain install --with gleam` below downloads into
        # <DENO_DIR>/denext-deno/gleam/<version>/<target> and SHA-256-verifies
        # (src/build/gleam-toolchain.ts). The cache below only saves that download (~10 MB); the CLI
        # still verifies what it finds there before running it. The same step as e2e.yml's.
        id: gleam-pin
        shell: bash
        run: |
          pin=src/build/gleam-toolchain-pin.json
          case "$RUNNER_ARCH" in X64) arch=x86_64 ;; ARM64) arch=aarch64 ;; *) arch="$RUNNER_ARCH" ;; esac
          target="linux-$arch"
          version=$(jq -r .version "$pin")
          sha=$(jq -r --arg t "$target" '.targets[$t].sha256' "$pin")
          echo "path=$HOME/.cache/deno/denext-deno/gleam/$version/$target" >> "$GITHUB_OUTPUT"
          echo "key=gleam-$target-$version-$sha" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned Gleam compiler
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.gleam-pin.outputs.path }}
          key: ${{ steps.gleam-pin.outputs.key }}

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Doc lint (JSR documentation coverage + docs anchors)
        # On the stock Deno, like fmt and lint: JSR scores the documentation of what stock
        # `deno publish` uploads. The task also runs scripts/check-doc-anchors.ts: every
        # `/docs/<page>#<anchor>` link must name an id the docs site renders.
        # Use the deno.json task as the single source of truth for the file list —
        # a hardcoded duplicate here drifts (e.g. missing class-component.ts /
        # next/cookies.ts) and reports false private-type-ref errors.
        run: deno task doc-lint

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: Install the pinned Gleam compiler
        # From the cache above when the pin is unchanged (verified, not downloaded again).
        run: deno run -A cli.ts toolchain install --with gleam

      - name: Type check
        # The toolchain's checker: native TypeScript 7, as `denext check` and the dev overlay run it.
        run: deno check cli.ts mod.ts

      - name: Unit tests
        # Includes the security suites (security / safe-fetch / nextjs-cve-parity).
        # Excludes tests/e2e/ (real headless Chromium; `deno task test:e2e`) and
        # tests/integration/ (heavy build/bundle tests; the `integration` job).
        # --unstable-kv enables the Deno KV cache-store tests.
        # DENEXT_TEST_GLEAM: the pinned Gleam installed above, so the suites that compile real
        # Gleam run (and fail, rather than skip, if that install is broken).
        run: deno task test:unit
        env:
          DENEXT_TEST_GLEAM: ${{ steps.gleam-pin.outputs.path }}/gleam

      - name: Test-count badge is current
        # Deterministic, source-derived count (like `deno fmt --check`): fails if
        # .github/badges/tests.json drifts from the number of Deno.test cases.
        # Regenerate with `deno task badge:tests` and commit. The README shows `main`'s
        # badge and the release script refreshes it before the tag, so the check runs
        # where it is displayed — `main` and the development → main PR — and on a manual
        # dispatch, the run `deno task release` counts (scripts/release-ci.ts), so the commit a
        # release is cut from is checked too; not on every push to `development`, where the
        # pre-commit hook no longer regenerates it (a per-commit badge put parallel commits in
        # conflict at nearly every rebase).
        if: >-
          github.ref == 'refs/heads/main' || github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch'
        run: deno task badge:tests --check

  # The client bundle budget on every event, pushes to `development` included: the shared-chunk
  # total of examples/hello's production build (`assertBundleBudgets`, 65,500 B raw) and the
  # tripwires next to it (no Fast Refresh runtime, no Node built-ins, the import gates). It is the
  # one test of tests/integration/build-smoke.test.ts that needs no Node or browser, and the
  # `integration` job that runs the whole file is skipped on a push, so a bundle regression would
  # otherwise show up only locally. One build: a minute or two.
  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below (see the header: what runs on what)

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: Shared-chunk budget (production build of examples/hello)
        # The same command runs locally (and in `deno task precheck` when a client module changed).
        run: deno task budget

  # `cargo audit` over the Rust-built wasm packages' lockfiles (packages/*/Cargo.lock: lightningcss,
  # photon, swc), each from its package directory so its .cargo/audit.toml ignores (each with the
  # reason the advisory cannot reach the wasm) apply. A vulnerability or an `unsound` advisory fails
  # (scripts/cargo-audit.ts). It runs on every push, so it also runs whenever a lockfile changes, and
  # a release needs it green: the advisory database is fetched fresh, so a new advisory against an
  # unchanged lockfile stops the release too. cargo-audit is the release's prebuilt binary,
  # SHA-256-pinned and cached; no Rust toolchain is installed. Seconds.
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # runs scripts/cargo-audit.ts only (no project code)

      - name: Cache cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo-audit-bin
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ env.CARGO_AUDIT_SHA256 }}

      - name: Download cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          name="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/ca.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${name}.tgz"
          echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/ca.tgz" | sha256sum -c -
          mkdir -p ~/.cargo-audit-bin
          tar -xzf "$RUNNER_TEMP/ca.tgz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-audit" ~/.cargo-audit-bin/cargo-audit

      - name: cargo audit (packages/*/Cargo.lock)
        run: CARGO_AUDIT="$HOME/.cargo-audit-bin/cargo-audit" deno task audit:cargo

      # The same gate for npm: `deno audit` over the root deno.lock and every example's deno.lock;
      # a high or critical advisory fails unless security/npm-audit-allow.json holds it (a fix
      # still under the age hold).
      - name: deno audit (deno.lock + examples)
        run: deno task audit:npm

  # Heavy build/bundle/type-check integration tests (real Deno subprocesses:
  # example-app builds, scaffold type-checking, Flight/static-export bundling).
  # Split out so it runs in parallel with `check` instead of extending it.
  integration:
    runs-on: ubuntu-latest
    # Heavy: PRs, `main` and a manual dispatch (see the trigger comment at the top).
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below (see the header: what runs on what)

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: Integration tests
        env:
          # tests/integration/cli-compiled-binary.test.ts: compile the CLI and run a plugin
          # project's verbs through the binary (the pinned child fetches denext from JSR).
          DENEXT_TEST_COMPILED_CLI: "1"
          # tests/integration/cli-remote-offline.test.ts: a CLI served over HTTP (as from JSR)
          # caches every verb for offline use (a fresh DENO_DIR: it downloads their dependencies).
          DENEXT_TEST_REMOTE_CLI: "1"
        run: deno task test:integration

  # Real-npm next-compat compatibility tests: SSR of Radix / recharts / react-hook-
  # form / dnd-kit / framer-motion / lucide through the next-compat build. They
  # install real npm packages (needs Node) but drive NO browser, so — unlike the
  # headless-Chromium e2e suite (dispatched before a release, e2e.yml) — they run on every PR to catch
  # npm-React compat regressions early. Runs in parallel with `check`/`integration`.
  next-compat:
    runs-on: ubuntu-latest
    # Heavy: PRs, `main` and a manual dispatch (see the trigger comment at the top).
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below (see the header: what runs on what)

      - name: Set up Node
        # The next-compat tests install and bundle real npm React packages.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Deno-managed npm packages (installed ad-hoc by the tests) also live here.
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: next-compat tests (real npm React libs, no browser)
        run: deno task test:next-compat

  # Coverage floor. Re-runs the unit + integration suites with coverage and fails
  # if line/branch/function coverage drops below the threshold in `test:coverage`
  # (currently 85%). Parallel with the other jobs. The backend-integration suites run here too,
  # against the same service containers as the `backend-integration` job, so the code only a real
  # Postgres / PostGIS / MinIO reaches counts toward the gate instead of being ignored.
  coverage:
    runs-on: ubuntu-latest
    # Heavy: PRs, `main` and a manual dispatch (see the trigger comment at the top).
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: dnxtest
          MINIO_ROOT_PASSWORD: dnxtest-secret
        ports:
          - 9100:9000
      redis:
        # denext's zero-npm Redis client and stores (tests/redis-integration.test.ts).
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # The backend-integration job's service env (see there); `scripts/test-run.ts --coverage`
      # runs every pass on denext's Deno toolchain, which has the `Deno.SQL` these suites need.
      DENEXT_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      DENEXT_TEST_POSTGIS_URL: postgres://postgres:pw@127.0.0.1:5433/postgres
      DENEXT_TEST_POSTGRES_JS: "1"
      DENEXT_TEST_POSTGRES_LOGICAL: "1"
      DENEXT_TEST_SUPABASE_JS: "1"
      DENEXT_TEST_S3_ENDPOINT: http://127.0.0.1:9100
      DENEXT_TEST_S3_ACCESS_KEY: dnxtest
      DENEXT_TEST_S3_SECRET_KEY: dnxtest-secret
      DENEXT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # The Kotlin client-emitter goldens compile with the runner's kotlinc (tests/clients.test.ts;
      # Go and Swift are found on PATH, Kotlin only through this variable: kotlinc is slow to start).
      DENEXT_KOTLINC: kotlinc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # runs scripts/test-run.ts, which runs every pass on the toolchain under --coverage

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Set up a JDK
        # The Android halves of the native templates are compiled with javac and run with java
        # (tests/_jdk.ts). Under CI those tests never skip: without a JDK they fail.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9100/minio/health/live && exit 0
            sleep 1
          done
          exit 1

      - name: Enable logical decoding on the Postgres service (wal_level = logical)
        run: |
          pg=${{ job.services.postgres.id }}
          docker exec "$pg" psql -U postgres -c "alter system set wal_level = logical"
          docker restart "$pg"
          for i in $(seq 1 60); do
            docker exec "$pg" pg_isready -U postgres && break
            sleep 1
          done
          docker exec "$pg" psql -U postgres -tAc "show wal_level" | grep -qx logical

      - name: Coverage (fails under the threshold)
        env:
          NO_COLOR: "1" # plain test names for the grep below
        run: |
          set -o pipefail
          deno task test:coverage 2>&1 | tee "$RUNNER_TEMP/coverage.txt"

      # The lcov report the per-file floors read, kept so a baseline can be raised from a CI run
      # without re-running the suite locally: `gh run download <run> -n coverage-lcov -D coverage`,
      # then `deno task coverage:ratchet:update` (scripts/coverage-ratchet.ts).
      - name: Upload the lcov report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: The backend-integration suites ran under coverage (none ignored)
        run: |
          # The files the backend-integration job runs: under coverage, none of their tests may be
          # ignored either (an ignored one means its service env is not wired into this job). The
          # Prisma adapter suites self-enable on a `Deno.SQL` with result columns (the toolchain's),
          # so an ignored one here means the pass ran on a runtime without it.
          files='backend-rls-integration|backend-rest-integration|backend-rest-supabase-integration|backend-realtime-integration|backend-supabase-realtime-integration|backend-auth-integration|db-admin-integration|db-migrations-integration|postgres-integration|backend-s3-minio|backend-supabase-functions|backend-storage-supabase-integration|backend-storage-rls-integration|backend-supabase-auth|backend-supabase-auth-integration|backend-platform-integration|backend-auth-replicas-integration|backend-rest-reload-integration|doctor-backend|redis-integration|next-auth-adapters-integration|prisma-adapter-postgres-integration|prisma-adapter-sqlite'
          awk -v files="^[.]/tests/($files)[.]test[.]ts$" '
            /^running [0-9]+ tests? from / { current = $NF; next }
            current ~ files && /\.\.\. ignored/ { print current ": " $0; bad = 1 }
            current ~ files && /\.\.\. ok/ { ran[current] = 1 }
            END {
              n = 0; for (f in ran) n++
              if (n < 23) { print "only " n " of 23 backend-integration files ran"; bad = 1 }
              exit bad
            }
          ' "$RUNNER_TEMP/coverage.txt" || {
            echo "::error::a backend integration suite was ignored or missing under coverage"
            exit 1
          }

  # @denext/backend and denext's Postgres stores against REAL services: Postgres (17, the major
  # Supabase runs) and MinIO (S3) as service containers. The suites connect as
  # the superuser only to create a throwaway NON-superuser app role + database per case; RLS's
  # `anon` / `authenticated` roles and `auth.*` come from the backend's own migration, realtime
  # uses plain LISTEN/NOTIFY (no wal settings), and the S3 suite creates its bucket. They need
  # `Deno.SQL`, so they run on denext's Deno toolchain (the fork's CLI, SHA-256 pinned below).
  # Every one of these tests is IGNORED without its service, so this job also fails if any test
  # was ignored: a green run means each one really ran. Heavy (PRs, `main`, a dispatch).
  backend-integration:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 20
    services:
      postgres:
        # Postgres 17 with the pgvector extension available (the vector search tests create it).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgis:
        # Only tests/backend-rest-supabase-integration.test.ts's GeoJSON case uses this one
        # (`Accept: application/geo+json` needs PostGIS); everything else runs on postgres:17.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      minio:
        # MinIO publishes no public images any more (minio/minio and quay.io/minio refuse
        # pulls); Bitnami's legacy build is the same server, and its entrypoint serves /data.
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: dnxtest
          MINIO_ROOT_PASSWORD: dnxtest-secret
        ports:
          - 9100:9000
      redis:
        # denext's zero-npm Redis client and stores (tests/redis-integration.test.ts).
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DENEXT_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      DENEXT_TEST_POSTGIS_URL: postgres://postgres:pw@127.0.0.1:5433/postgres
      DENEXT_TEST_POSTGRES_JS: "1" # the stock-Deno path (npm:postgres via fromPostgresJs) too
      DENEXT_TEST_POSTGRES_LOGICAL: "1" # wal_level = logical (set below): realtime's logical source
      DENEXT_TEST_SUPABASE_JS: "1" # the stock @supabase/supabase-js client against the app
      DENEXT_TEST_S3_ENDPOINT: http://127.0.0.1:9100
      DENEXT_TEST_S3_ACCESS_KEY: dnxtest
      DENEXT_TEST_S3_SECRET_KEY: dnxtest-secret
      DENEXT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # denext's Deno toolchain (Deno.SQL): the Brainwires/deno fork's CLI release, verified.
      DENEXT_DENO_RELEASE: denext-runtime-v3.0.0-denext.2
      DENEXT_DENO_ZIP: deno-cli-3.0.0-denext.2-x86_64-unknown-linux-gnu.zip
      DENEXT_DENO_SHA256: 7134d7fe2f399919428e5abde4b6d37e99662531b74d3515ff5910a139d71bc5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up denext's Deno toolchain
        run: |
          dir="$RUNNER_TEMP/denext-deno"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/deno.zip" \
            "https://github.com/Brainwires/deno/releases/download/$DENEXT_DENO_RELEASE/$DENEXT_DENO_ZIP"
          echo "$DENEXT_DENO_SHA256  $dir/deno.zip" | sha256sum -c -
          unzip -q -o "$dir/deno.zip" -d "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/deno" --version
          "$dir/deno" eval 'if (typeof Deno.SQL !== "function") throw new Error("no Deno.SQL")'

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-backend-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-backend-

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9100/minio/health/live && exit 0
            sleep 1
          done
          exit 1

      - name: Enable logical decoding on the Postgres service (wal_level = logical)
        run: |
          pg=${{ job.services.postgres.id }}
          docker exec "$pg" psql -U postgres -c "alter system set wal_level = logical"
          docker restart "$pg"
          for i in $(seq 1 60); do
            docker exec "$pg" pg_isready -U postgres && break
            sleep 1
          done
          docker exec "$pg" psql -U postgres -tAc "show wal_level" | grep -qx logical

      - name: Backend + Postgres integration tests (real Postgres, PostGIS and MinIO)
        env:
          NO_COLOR: "1" # plain test names for the grep below
        run: |
          set -o pipefail
          deno test -A --unstable-kv \
            tests/backend-rls-integration.test.ts \
            tests/backend-rest-integration.test.ts \
            tests/backend-rest-supabase-integration.test.ts \
            tests/backend-realtime-integration.test.ts \
            tests/backend-supabase-realtime-integration.test.ts \
            tests/backend-auth-integration.test.ts \
            tests/db-admin-integration.test.ts \
            tests/db-migrations-integration.test.ts \
            tests/postgres-integration.test.ts \
            tests/backend-s3-minio.test.ts \
            tests/backend-supabase-functions.test.ts \
            tests/backend-storage-supabase-integration.test.ts \
            tests/backend-storage-rls-integration.test.ts \
            tests/backend-supabase-auth.test.ts \
            tests/backend-supabase-auth-integration.test.ts \
            tests/backend-platform-integration.test.ts \
            tests/backend-auth-replicas-integration.test.ts \
            tests/backend-rest-reload-integration.test.ts \
            tests/doctor-backend.test.ts \
            tests/redis-integration.test.ts \
            tests/next-auth-adapters-integration.test.ts \
            tests/prisma-adapter-postgres-integration.test.ts \
            tests/prisma-adapter-sqlite.test.ts 2>&1 | tee "$RUNNER_TEMP/backend.txt"

      - name: No test was ignored (each service was really reached)
        run: |
          if grep -E '\.\.\. ignored|[1-9][0-9]* ignored' "$RUNNER_TEMP/backend.txt"; then
            echo "::error::a backend integration test was ignored: its service env is not wired"
            exit 1
          fi
          grep -E '^ok \| [0-9]+ passed' "$RUNNER_TEMP/backend.txt"

  # The iOS shell's export router (Swift), compiled with swiftc and run over the shared export-route
  # vectors (tests/export-routes-conformance.test.ts). The test is ignored where there is no darwin
  # + swiftc, so the Linux jobs never run it; this job does, on every event, and fails if the
  # compiled case was ignored rather than passed.
  ios-export-router:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below (see the header: what runs on what)

      - name: Set up a JDK
        # The Android halves of the native templates are compiled with javac and run with java
        # (tests/_jdk.ts). Under CI those tests never skip: without a JDK they fail.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Default DENO_DIR on macOS; denext's Deno toolchain is cached in it too.
          path: ~/Library/Caches/deno
          key: ${{ runner.os }}-${{ runner.arch }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: swiftc is on the runner
        run: swiftc --version

      - name: Export routes conformance (the iOS router compiled with swiftc)
        env:
          NO_COLOR: "1" # plain test names for the grep below
        run: |
          set -o pipefail
          deno test -A --unstable-kv tests/export-routes-conformance.test.ts 2>&1 | tee "$RUNNER_TEMP/export-routes.txt"
          grep -E 'the iOS router \(compiled\) serves every vector \.\.\. ok' "$RUNNER_TEMP/export-routes.txt"

      - name: Native snippets (type-checked against the iOS SDK and a Capacitor stub)
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          deno test -A --unstable-kv tests/react-native-memory-warning.test.ts tests/react-native-dismiss-action-sheet.test.ts 2>&1 | tee "$RUNNER_TEMP/native-snippets.txt"
          grep -E 'the forwarder type-checks against UIKit and a Capacitor stub \.\.\. ok' "$RUNNER_TEMP/native-snippets.txt"
          grep -E 'the plugin type-checks against UIKit and a Capacitor stub \.\.\. ok' "$RUNNER_TEMP/native-snippets.txt"

      - name: OTA re-verification (the Swift store compiled and run; the plugin type-checked)
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          deno test -A --unstable-kv tests/ota-reverify.test.ts 2>&1 | tee "$RUNNER_TEMP/ota-reverify.txt"
          grep -E 'the Swift store compiles and refuses a tampered UI \.\.\. ok' "$RUNNER_TEMP/ota-reverify.txt"
          grep -E 'the plugin and the store type-check against UIKit and a Capacitor stub \.\.\. ok' "$RUNNER_TEMP/ota-reverify.txt"

      - name: Storage and file transfers (the Swift halves compiled and run; SQLCipher via SwiftPM)
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          deno test -A --unstable-kv tests/mobile-storage-cipher-native.test.ts tests/mobile-file-transfer-native.test.ts 2>&1 | tee "$RUNNER_TEMP/native-storage.txt"
          grep -E 'without SQLCipher a key is refused and nothing is written in the clear \.\.\. ok' "$RUNNER_TEMP/native-storage.txt"
          grep -E 'with SQLCipher \(the Swift package\) a store is encrypted, moved and keyed \.\.\. ok' "$RUNNER_TEMP/native-storage.txt"
          grep -E 'storage \(iOS\): the plugin and the store type-check against UIKit and a Capacitor stub \.\.\. ok' "$RUNNER_TEMP/native-storage.txt"
          grep -E 'the manager downloads, pauses, resumes and uploads \(macOS URLSession\) \.\.\. ok' "$RUNNER_TEMP/native-storage.txt"
          grep -E 'the plugin and the manager type-check against UIKit and a Capacitor stub \.\.\. ok' "$RUNNER_TEMP/native-storage.txt"

  # The unit and integration suites on Windows: the same tasks as `check` and `integration`, so a
  # drive letter, a backslash or a file Windows keeps locked fails here rather than on a user's
  # machine. Heavy (both suites on one runner): PRs, `main` and a manual dispatch, like
  # `integration`. The JDK is there for the same reason as in `check` (the Android templates).
  windows-tests:
    runs-on: windows-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below (see the header: what runs on what)

      - name: Set up a JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Default DENO_DIR on Windows (%LOCALAPPDATA%\deno).
          path: ~\AppData\Local\deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      # The tests' temp projects go on the checkout's drive (D:), not C:\Users\RUNNER~1\…: up to
      # runtime 3.0.0-rc.4 a temp app on another drive than this checkout failed to build. Deno's
      # synthetic workspace import map wrote a member's / linked config's `imports` relative to the
      # root config, and a value on another drive resolved under the root's drive
      # (`file:///C:/D:/…`). 3.0.0-rc.5 writes such a value as an absolute URL; the temp projects
      # stay here until a run on another drive confirms it. runner.temp has no 8.3 short names.
      - name: Unit tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: deno task test:unit

      - name: Integration tests
        if: ${{ !cancelled() }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          DENEXT_TEST_COMPILED_CLI: "1"
          DENEXT_TEST_REMOTE_CLI: "1"
        run: deno task test:integration

  # The unit suite on macOS (Apple silicon: one arm64 leg, mindful of the shared macOS runners):
  # every `Deno.build.os === "darwin"` branch outside the desktop suites (code signing, the Deno
  # and fastlane toolchains, mobile build / inspect, the profiler's browser, `denext ui`'s opener
  # and signing panel, the CLI's self-exec) runs here, on denext's Deno toolchain. The ad-hoc
  # `codesign` test (a real Mach-O signed with the Hardened Runtime + allow-jit, verified and run)
  # is ignored off darwin, so this job fails if it was ignored rather than passed. Heavy (PRs,
  # `main` and a manual dispatch), like `windows-tests`; a release needs it green.
  macos-tests:
    runs-on: macos-latest
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below (see the header: what runs on what)

      - name: Set up a JDK
        # The Android halves of the native templates are compiled with javac and run with java
        # (tests/_jdk.ts). Under CI those tests never skip: without a JDK they fail.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # Default DENO_DIR on macOS; denext's Deno toolchain is cached in it too.
          path: ~/Library/Caches/deno
          key: ${{ runner.os }}-${{ runner.arch }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: Unit tests
        env:
          NO_COLOR: "1" # plain test names for the grep below
        run: |
          set -o pipefail
          deno task test:unit 2>&1 | tee "$RUNNER_TEMP/unit.txt"

      - name: The real ad-hoc codesign test ran (not ignored)
        run: |
          grep -E 'signCompiledBinary: a real ad-hoc codesign of a Mach-O, verified, and it runs \.\.\. ok' "$RUNNER_TEMP/unit.txt"

  # Module resolution on Windows: the esbuild deno-loader's WASM spells drive paths `/C:/…`,
  # which Windows refuses, so a build that passed on Linux and macOS could fail here (a bare
  # package.json dependency under `nodeModulesDir: "manual"`). Runs on every event.
  windows-resolve:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # bootstraps the toolchain step below (see the header: what runs on what)

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~\AppData\Local\deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Put denext's Deno toolchain on PATH
        # The pinned build users run (scripts/ci/toolchain-on-path.ts; verified, cached in DENO_DIR):
        # every later step's `deno` is the toolchain. Steps above it keep the stock Deno.
        run: deno run -A scripts/ci/toolchain-on-path.ts

      - name: The deno-loader resolves package.json dependencies on Windows
        run: deno test -A tests/deno-loader-plugins.test.ts

      - name: The deno-loader's own deno info children are bounded on Windows
        run: deno test -A tests/loader-deno-info.test.ts
