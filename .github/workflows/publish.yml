name: Publish to JSR

# Publishing from GitHub Actions with `id-token: write` lets JSR record build
# provenance (a public transparency-log entry), which raises the JSR score and
# lets consumers verify the package was built from this repo. No token secret is
# needed — the package is linked to this repo on jsr.io (OIDC trust).
#
# This is a Deno WORKSPACE (root @denext/denext + packages/*). Each package
# publishes INDEPENDENTLY, keyed by its tag prefix, so a release never re-cuts
# every package — only the one you tagged. `deno publish --config <path>` scopes
# the publish to exactly that package (the root's own deno.json publishes only
# @denext/denext, NOT the members).
#
#   git tag v1.0.1            && git push origin v1.0.1              # @denext/denext
#   git tag pages-router-v0.3.1 && git push origin pages-router-v0.3.1  # @denext/pages-router
#   git tag photon-v1.1.0     && git push origin photon-v1.1.0       # @denext/photon
#   git tag htmx-v2.0.10      && git push origin htmx-v2.0.10        # @denext/htmx
#   git tag effect-v0.1.0     && git push origin effect-v0.1.0       # @denext/effect
#   git tag openapi-v0.1.0    && git push origin openapi-v0.1.0      # @denext/openapi
#   git tag graphql-v0.1.0    && git push origin graphql-v0.1.0      # @denext/graphql
#   git tag react-router-v0.1.0 && git push origin react-router-v0.1.0  # @denext/react-router
#   git tag content-collections-v0.1.0 && git push origin content-collections-v0.1.0  # @denext/content-collections
#   git tag backend-v0.1.0    && git push origin backend-v0.1.0      # @denext/backend
#   git tag lightningcss-v1.0.0-rc.72 && git push origin lightningcss-v1.0.0-rc.72  # @denext/lightningcss
#   git tag swc-v76.0.0      && git push origin swc-v76.0.0          # @denext/swc
#   (likewise avif-v* / og-v* / sqlite-v*)
#
# Bump the version in that package's deno.json before tagging — JSR rejects
# re-publishing an existing version. Each member must be created + linked to this
# repo on jsr.io once before its first publish.

on:
  push:
    tags:
      - "v*" # @denext/denext (root)
      - "photon-v*" # @denext/photon
      - "avif-v*" # @denext/avif
      - "og-v*" # @denext/og
      - "sqlite-v*" # @denext/sqlite
      - "pages-router-v*" # @denext/pages-router
      - "htmx-v*" # @denext/htmx
      - "effect-v*" # @denext/effect
      - "openapi-v*" # @denext/openapi
      - "graphql-v*" # @denext/graphql
      - "react-router-v*" # @denext/react-router
      - "content-collections-v*" # @denext/content-collections
      - "backend-v*" # @denext/backend
      - "lightningcss-v*" # @denext/lightningcss
      - "swc-v*" # @denext/swc

permissions:
  contents: read
  id-token: write # required for JSR provenance / OIDC publishing
  actions: read # scripts/publish-verify.ts asks for ci.yml's runs on the tagged commit

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2 # the release commit's parent, for scripts/publish-verify.ts

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6" # pinned for reproducible fmt/lint; bump deliberately and re-run `deno fmt`

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Set up a JDK
        # The Android halves of the native templates are compiled with javac and run with java
        # (tests/_jdk.ts). Under CI those tests never skip: without a JDK they fail.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve package config from the tag
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            photon-v*)       cfg=packages/photon/deno.json ;;
            avif-v*)         cfg=packages/avif/deno.json ;;
            og-v*)           cfg=packages/og/deno.json ;;
            # @denext/sqlite is ON HOLD / UNPUBLISHED — the framework uses Deno's built-in
            # node:sqlite. This package is not shipped for now (future: WASM-compile real
            # SQLite). Fails on purpose so a sqlite-v* tag can't publish it by accident.
            sqlite-v*)       echo "::error::@denext/sqlite is on hold (unpublished) — see packages/sqlite/README.md"; exit 1 ;;
            pages-router-v*) cfg=packages/pages-router/deno.json ;;
            htmx-v*)         cfg=packages/htmx/deno.json ;;
            effect-v*)       cfg=packages/effect/deno.json ;;
            openapi-v*)      cfg=packages/openapi/deno.json ;;
            graphql-v*)      cfg=packages/graphql/deno.json ;;
            react-router-v*) cfg=packages/react-router/deno.json ;;
            content-collections-v*) cfg=packages/content-collections/deno.json ;;
            backend-v*)      cfg=packages/backend/deno.json ;;
            lightningcss-v*) cfg=packages/lightningcss/deno.json ;;
            swc-v*)          cfg=packages/swc/deno.json ;;
            v*)              cfg=deno.json ;;
            *) echo "::error::unrecognized tag '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
          echo "config=$cfg" >> "$GITHUB_OUTPUT"
          echo "Publishing package configured by $cfg"

      # The whole suite runs only when CI hasn't already passed it: on the tagged commit itself
      # (fmt + lint only), or on the parent of the release script's own `release: denext <v>`
      # commit (the release's delta gate). Anything else, a failure to ask CI included, runs the
      # whole-workspace gate. See scripts/publish-verify.ts.
      - name: Decide how much to re-verify
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno run -A scripts/publish-verify.ts "$GITHUB_SHA"

      - name: Verify (fmt, lint, types, tests)
        # The full gate mirrors the `check` task; the e2e suite runs separately
        # (`deno task test:e2e`). scripts/test-run.ts runs the files that change
        # process-wide state (tests/serial-tests.ts) after the parallel pass, one at a time.
        env:
          VERIFY: ${{ steps.verify.outputs.commands }}
        run: sh -ec "$VERIFY"

      - name: Publish exactly the tagged source
        # `deno publish` refuses a dirty tree. A test that leaves a file behind must not block
        # (or leak into) a release: show what it left, then restore the checkout to the tag.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::the verify step left the tree dirty (fix the test that writes these):"
            git status --porcelain
            git diff --stat
            git checkout -- .
            git clean -fdq
          fi

      - name: Publish to JSR (with provenance)
        run: deno publish --config ${{ steps.pkg.outputs.config }}

  # The in-PATH `denext` binary. Runs only for a root `v*` tag, and only after the JSR publish
  # succeeded — a failed publish must never ship a binary claiming that version.
  #
  # A binary carries one framework version. Inside a project it defers to the project's pinned
  # denext (see `maybeReexecPinned` in cli.ts), so these artifacts are a CLI, not a second copy
  # of the framework for an app to build against.
  #
  # Each leg only builds, smoke-tests and UPLOADS its archive as a workflow artifact; the
  # `release` job below creates the GitHub release once, with every asset, after all five legs
  # have succeeded. Five legs each calling the release action raced to create the release, and a
  # leg that failed left a release with some assets missing — the installer would then fetch
  # "latest" and find no archive for its platform.
  binaries:
    needs: publish
    if: startsWith(github.ref_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke` is whether the runner can EXECUTE the binary it built. Every leg builds on
          # ubuntu-latest (x86_64): `deno compile --target` cross-compiles and the Mach-O legs
          # are signed with rcodesign, so no leg waits for a macOS runner. The `macos-check` job
          # runs the released Mac binaries after the release.
          - target: x86_64-apple-darwin
            os: ubuntu-latest
            smoke: false
          - target: aarch64-apple-darwin
            os: ubuntu-latest
            smoke: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            smoke: false
          - target: x86_64-pc-windows-msvc
            os: ubuntu-latest
            smoke: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"

      - name: Compile
        run: |
          out=denext
          case "${{ matrix.target }}" in *windows*) out=denext.exe ;; esac
          deno compile -A --target ${{ matrix.target }} --output "$out" cli.ts
          ls -lh "$out"

      # The binary has to RUN, not merely link: `--version` proves it starts and knows it is a
      # binary (and that the tag matches the version baked into it — the two are bumped
      # separately), `--help` proves the command table loads, and `build` in a directory that
      # pins no denext proves the refusal path (a binary never builds an app in its own
      # process) exits 1 with the message the docs quote, rather than crashing or, worse,
      # building with the binary's own framework.
      - name: Smoke-test the binary
        if: matrix.smoke
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          ./denext --version | tee /dev/stderr | grep -Fx "denext $version (binary)"
          ./denext --help | grep -F "Usage" >/dev/null
          scratch="$(mktemp -d)"
          set +e
          out="$(cd "$scratch" && "$GITHUB_WORKSPACE/denext" build 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$out"
          [ "$code" -eq 1 ] || { echo "::error::expected exit 1 from an unpinned build, got $code"; exit 1; }
          printf '%s\n' "$out" | grep -F "pins no denext" >/dev/null

      # Unsigned macOS binaries are quarantined by Gatekeeper on download. Signing needs an
      # Apple Developer ID; notarisation needs an App Store Connect key. Both are repository
      # secrets — when they are absent the step is skipped and the artifact ships unsigned,
      # which the install script and the docs call out. Signing runs on Linux with rcodesign
      # (apple-codesign, pinned by SHA-256), so the Mac legs need no macOS runner.
      # Every Mac binary is signed here, on Linux, with rcodesign (apple-codesign, pinned by
      # SHA-256). Without the Developer ID secrets the signature is ad-hoc — what `deno compile`
      # gives a Mac binary built on a Mac (Apple Silicon refuses to run an unsigned one, and
      # a cross-compiled x86_64 Mach-O comes out unsigned) — and Gatekeeper still quarantines
      # the download, which the install script strips and the docs call out. With them it is a
      # Developer ID signature with the hardened runtime, then notarised.
      - name: Sign (and notarise) the Mac binary
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          rcs=apple-codesign-0.29.0-x86_64-unknown-linux-musl
          curl -fsSLo rcs.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/$rcs.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rcs.tar.gz" | sha256sum -c -
          tar xzf rcs.tar.gz && rcodesign="$PWD/$rcs/rcodesign"
          # `secrets` is not a context a step-level `if` can read, so the guard lives here.
          if [ -z "${APPLE_CERT:-}" ]; then
            echo "denext: no Developer ID secrets — signing this binary ad-hoc" >&2
            "$rcodesign" sign denext
            rm -rf rcs.tar.gz "$rcs"
            exit 0
          fi
          echo "$APPLE_CERT" | base64 --decode > cert.p12
          printf '%s' "$APPLE_CERT_PASSWORD" > cert.pw
          # --for-notarization: the hardened runtime and a secure timestamp, as notarisation needs.
          "$rcodesign" sign --p12-file cert.p12 --p12-password-file cert.pw --for-notarization denext
          echo "$APPLE_API_KEY" | base64 --decode > key.p8
          "$rcodesign" encode-app-store-connect-api-key -o key.json \
            "$APPLE_API_ISSUER" "$APPLE_API_KEY_ID" key.p8
          zip -q denext.zip denext
          # A bare executable cannot be stapled (stapler takes .app/.dmg/.pkg only), so the
          # notarisation ticket is checked online by Gatekeeper on first run.
          "$rcodesign" notary-submit --api-key-file key.json --wait denext.zip
          rm -rf cert.p12 cert.pw key.p8 key.json denext.zip rcs.tar.gz "$rcs"

      # Asset names — the installers (scripts/install.sh, scripts/install.ps1) and the docs depend
      # on these exactly:
      #   denext-<target>.tar.gz          (denext-<target>.zip on Windows)
      #   denext-<target>.tar.gz.sha256   one `sha256sum`-format line for that archive
      # The release job concatenates the per-archive lines into a combined SHA256SUMS.
      - name: Package
        run: |
          set -eu
          mkdir -p dist
          name="denext-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            *windows*) archive="$name.zip"; zip "dist/$archive" denext.exe ;;
            *) archive="$name.tar.gz"; tar czf "dist/$archive" denext ;;
          esac
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          cat "dist/$archive.sha256"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denext-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ONE release, created once every leg has its archive. `needs` on the matrix job means a
  # single failed leg (fail-fast is off, so the others still finish and upload) skips this job
  # entirely — a release is all five platforms or nothing.
  release:
    needs: binaries
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the assets
    steps:
      # The checkout + Deno are for scripts/gen-package-manifests.ts (below) only.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"

      - name: Download every archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: denext-*
          path: dist
          merge-multiple: true

      # SHA256SUMS is what the installer verifies against first (one fetch covers any
      # platform); the per-archive `.sha256` files stay beside it as the fallback.
      - name: Write the combined checksum file
        run: |
          set -eu
          cd dist
          cat ./*.sha256 > SHA256SUMS
          echo "::group::SHA256SUMS"; cat SHA256SUMS; echo "::endgroup::"
          # Every archive is listed, and every listed archive is present.
          for f in denext-*.tar.gz denext-*.zip; do grep -F " $f" SHA256SUMS >/dev/null; done
          sha256sum -c SHA256SUMS
          ls -l

      # The package-manager manifests, from the SHA256SUMS just verified: a Homebrew formula
      # (denext.rb), a Scoop manifest (denext.json) and the winget set (Brainwires.denext*.yaml).
      # They are release assets only — publishing them to a tap, a bucket or winget-pkgs is a
      # maintainer step (CONTRIBUTING.md → "Package managers"). Generated after SHA256SUMS, so
      # SHA256SUMS lists only the archives install.sh / install.ps1 download.
      - name: Generate the package-manager manifests
        run: deno run -A scripts/gen-package-manifests.ts --version "$GITHUB_REF_NAME" --sums dist/SHA256SUMS --out dist

      # A tag with a prerelease suffix (`v2.5.0-rc.1`) is a GitHub PRERELEASE and is never
      # "latest": `releases/latest` — what the installer resolves with no DENEXT_VERSION — must
      # only ever name a stable version.
      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: dist/*
          fail_on_unmatched_files: true

  # The Mac binaries are built and signed on Linux; this runs the RELEASED ones on a Mac (the
  # signature verifies, the arm64 one starts and knows its version). It is off the release's
  # critical path on purpose — a macOS runner can queue for half an hour — so a failure here
  # means the shipped Mac archives need a follow-up release.
  macos-check:
    needs: release
    if: startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Run the released Mac binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "denext-$t.tar.gz*"
            shasum -a 256 -c "denext-$t.tar.gz.sha256"
            mkdir "$t" && tar xzf "denext-$t.tar.gz" -C "$t"
            codesign --verify --strict --verbose=2 "$t/denext"
          done
          ./aarch64-apple-darwin/denext --version | tee /dev/stderr |
            grep -Fx "denext $version (binary)"
          ./aarch64-apple-darwin/denext --help | grep -F "Usage" >/dev/null
