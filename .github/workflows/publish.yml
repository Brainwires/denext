name: Publish to JSR

# Publishing from GitHub Actions with `id-token: write` lets JSR record build
# provenance (a public transparency-log entry), which raises the JSR score and
# lets consumers verify the package was built from this repo.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for JSR provenance / OIDC publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Verify (fmt, lint, types, tests)
        # Includes the security suites (security / safe-fetch / nextjs-cve-parity).
        # The e2e suite drives a real headless Chromium and is intentionally
        # excluded here (it runs via `deno task test:e2e`); --unstable-kv enables
        # the Deno KV cache-store tests. Mirrors the `test`/`check` tasks.
        run: |
          deno fmt --check
          deno lint
          deno check cli.ts mod.ts
          deno test -A --unstable-kv --parallel --ignore=tests/e2e/

      - name: Publish to JSR (with provenance)
        run: deno publish
