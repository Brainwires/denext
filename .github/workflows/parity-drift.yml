name: Parity drift

# Weekly (and on-demand) check for upstream React/ReactDOM/Next surface changes vs the
# committed baseline in `tests/fixtures/react-surface.baseline.json`. This is a
# non-blocking heads-up, NOT the parity gate — the blocking structural-parity check runs
# offline in the `check` job (via `deno task test`, `tests/react-parity.test.ts`) against
# the committed baseline + known-gaps ledger. When this job reports drift, run
# `deno task parity:refresh` locally, review, and re-run `deno task parity:gaps`.
#
# A push to `development` that changes the drift tooling or the committed baseline runs it too, so
# a broken extractor or a baseline refreshed by hand shows up on the push instead of the next Monday.
# The filter lists what `parity:drift` runs and imports (tests/workflow-path-filters.test.ts fails
# when the scripts import a file it misses); it imports nothing from src/.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - "scripts/parity/*.ts"
      - "tests/fixtures/react-surface.baseline.json"
      - ".github/workflows/parity-drift.yml"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"

      - name: Set up Node
        # `parity:drift` installs the real latest React/ReactDOM/Next(-intl) via npm.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Report upstream surface drift (non-blocking)
        run: deno task parity:drift
