name: Parity drift

# On-demand check for upstream React/ReactDOM/Next surface changes vs the
# committed baseline in `tests/fixtures/react-surface.baseline.json`. This is a
# non-blocking heads-up, NOT the parity gate — the blocking structural-parity check runs
# offline in the `check` job (via `deno task test`, `tests/react-parity.test.ts`) against
# the committed baseline + known-gaps ledger. When this job reports drift, run
# `deno task parity:refresh` locally, review, and re-run `deno task parity:gaps`.
#
# A push to `development` that changes the drift tooling or the committed baseline runs it too, so
# a broken extractor or a baseline refreshed by hand shows up on the push instead of the next dispatch.
# The filter lists what `parity:drift` runs and imports (tests/workflow-path-filters.test.ts fails
# when the scripts import a file it misses); it imports nothing from src/.

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - "scripts/parity/*.ts"
      - "src/ts/program-api.ts" # the TypeScript program API the extractor reads through
      - "src/compat/next-auth/providers/list.ts" # the provider ids spec.ts lists
      - "tests/fixtures/react-surface.baseline.json"
      - "tests/fixtures/preact-surface.baseline.json"
      - ".github/workflows/parity-drift.yml"

permissions:
  contents: read

# A newer push to the same branch supersedes its run. Never cancelled: a run on `main`, a pull
# request's, and a dispatch (the event is part of the group, so a push never cancels a dispatched
# run, such as the one a release is gated on).
concurrency:
  group: parity-drift-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

jobs:
  # Picks the job's runner (Brainwires/.github's pick-runners action): our self-hosted Linux pool while
  # biscuits' shared Linux capacity has a free slot, else ubuntu-latest at once (always on a fork's
  # pull request). It runs on GitHub's image (it must not wait in the queue it shortens) and never
  # fails: the job's `|| 'ubuntu-latest'` takes GitHub's image if the plan is empty.
  runners:
    name: pick runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the repository's queued / running jobs
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@067b448d5eb4f03857159feba626dca848c52176 # pick-runners
        with:
          jobs: drift=linux-x64
          vars: ${{ toJSON(vars) }}
          runner-token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  drift:
    # Linux: the runners job's pick (`linux-x64`): our pool while biscuits' shared Linux capacity has
    # a free slot, else ubuntu-latest at once; always ubuntu-latest on a fork's pull request.
    needs: runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').drift || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"

      - name: Set up Node
        # `parity:drift` installs the real latest React/ReactDOM/Next(-intl) via npm.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Report upstream surface drift (non-blocking)
        run: deno task parity:drift
