name: Parity (react-native / expo)

# Blocking structural-parity gate for denext's mobile compat surface — the twin of the
# React/ReactDOM/Next gate that runs offline in `ci.yml`'s `check` job. Unlike that one,
# this needs npm (it installs `react-native-web`, the package `src/build/react-native.ts`
# aliases `react-native` to, for the live diff), so it is its own job with Node set up —
# mirroring the `next-compat` job. It is BASELINE-GATED: it fails only on a NEW deviation
# not already waived (scripts/parity/native/waivers.ts) or tracked in the known-gaps
# ledger (scripts/parity/native/baselines/known-gaps.json).
#
#   • react-native — live `react-native-web` vs the committed baseline.
#   • expo — each `denext/expo/<name>` shim (listed in `src/expo/manifest.ts`) vs its
#     pinned `expo-*` baseline (scripts/parity/native/baselines/expo.baseline.json), minus
#     the shim's `omitted` list. Offline: it runs `deno doc` over the shims, no npm.
#
# Heavy (installs npm): PRs to `main` and `main` itself, where it gates the release merge —
# same policy as the `integration` / `next-compat` jobs in ci.yml. Run it any time via the
# workflow_dispatch button. Accept a new baseline with `deno task parity:native:refresh`
# and record intentional gaps with `deno task parity:native:gaps`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.6"

      - name: Set up Node
        # `parity:native` installs `react-native-web` (and any pinned `expo-*`) via npm.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-deno-

      - name: Native parity gate (react-native + expo)
        run: deno task parity:native
