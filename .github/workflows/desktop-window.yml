# The desktop kitchen sink's window test (examples/desktop-kitchen-sink) on every desktop OS: package
# the app with denext's pinned Deno Desktop runtime, open it in a real window and assert every check
# the page runs (capabilities, the window API, deep links, the bridge gate, auth sessions, passkeys,
# the Clerk bridge, and a full-app update installed, left unconfirmed and rolled back).
#
# A check that cannot run on a hosted runner reports `skip` with its reason; every skip is listed in
# the job summary, and a skip without a reason fails the run. The last job puts every check of every
# OS in one table.

name: Desktop window test

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 5 * * *" # nightly, 05:17 UTC
  push:
    branches: [development]
    paths:
      - "src/desktop/**"
      - "src/build/desktop*.ts"
      - "src/build/desktop-runtime-pin.json"
      - "src/build/app-update.ts"
      - "src/build/ota-signing.ts"
      - "src/mobile/**"
      - "examples/desktop-kitchen-sink/**"
      - "scripts/ci/desktop-window-summary.ts"
      - ".github/workflows/desktop-window.yml"

permissions:
  contents: read

concurrency:
  group: desktop-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window-test:
    name: window test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x64 }
          - { os: windows-latest, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/desktop-kitchen-sink
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7" # exactly: denext's pinned Deno Desktop runtime is built for it
      # The pinned runtime (verified by SHA-256 on every use) and the npm addon the app loads.
      - name: Cache the Deno Desktop runtime
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno/denext-desktop-runtime
            ~/Library/Caches/deno/denext-desktop-runtime
            ~/AppData/Local/deno/denext-desktop-runtime
          key: desktop-runtime-${{ matrix.label }}-${{ hashFiles('src/build/desktop-runtime-pin.json') }}
      # Linux: a display (Xvfb), a window manager, a D-Bus session with a Secret Service
      # (gnome-keyring + secret-tool), a notification server (dunst), the XDG scheme tools, and
      # the WebKitGTK runtime the webview backend loads.
      - name: Linux desktop session
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xfwm4 dbus dbus-x11 gnome-keyring libsecret-tools dunst \
            xdg-utils desktop-file-utils zenity \
            libwebkit2gtk-4.1-0 libgtk-3-0 libsoup-3.0-0 libayatana-appindicator3-1
      - name: Window test (Linux, headless session)
        if: runner.os == 'Linux'
        env:
          KITCHEN_SINK_XDG: ${{ runner.temp }}/kitchen-sink-xdg
        run: e2e/linux-session.sh deno task test:window
      - name: Window test
        if: runner.os != 'Linux'
        run: deno task test:window
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-window-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            examples/desktop-kitchen-sink/e2e/.run/*.json
            examples/desktop-kitchen-sink/e2e/.run/*.log
            examples/desktop-kitchen-sink/e2e/.run/*.marker
            examples/desktop-kitchen-sink/e2e/.run/bin/browser.log

  summary:
    name: results by OS
    needs: window-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.7"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-window-*
          path: window-results
      - name: Every check, every OS
        run: deno run --allow-read scripts/ci/desktop-window-summary.ts window-results >> "$GITHUB_STEP_SUMMARY"
