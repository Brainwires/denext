services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: denext
      POSTGRES_PASSWORD: denext
      POSTGRES_DB: denext
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U denext"]
      interval: 2s
      timeout: 3s
      retries: 20
