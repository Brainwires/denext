[package]
name = "denext-photon"
# major.minor tracks the upstream photon-rs release (pinned at =0.3.3 below); the
# patch advances for denext wrapper/build changes (0.3.4 = opt-level=3 + LTO build).
version = "0.3.4"
edition = "2024"
license = "Apache-2.0"
description = "Deno/JSR wasm build of the photon-rs resize/encode subset used by denext's image optimizer"
repository = "https://github.com/Brainwires/denext"

[lib]
crate-type = ["cdylib"]

# Image codec is CPU-bound → optimize for speed, not size. Closes most of the
# latency gap vs @cf-wasm/photon (wasm-pack --release).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
# photon-rs already ships #[wasm_bindgen] bindings; @cf-wasm/photon@0.4.0 is this
# same crate built with wasm-pack. Pin the exact version and record it in the
# package README so codec updates are deliberate.
photon-rs = "=0.3.3"
# wasmbuild pins the wasm-bindgen CLI version; the crate must depend on the match.
wasm-bindgen = "=0.2.108"
