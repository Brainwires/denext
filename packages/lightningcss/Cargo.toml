[package]
# Independent semver, but started matching the wrapped `lightningcss` crate
# (1.0.0-alpha.72, relabelled rc.72 for JSR) — the same codec `lightningcss-wasm`
# builds from. See README for the versioning rule.
name = "denext-lightningcss"
version = "1.0.0-rc.72"
edition = "2021"
license = "MPL-2.0"
description = "Deno/JSR wasm build of the lightningcss transform subset denext's CSS pipeline uses"
repository = "https://github.com/Brainwires/denext"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The core codec. Pin exact; `serde` enables Serialize on CssModuleExports so the
# `transform` result's `exports` map crosses to JS with the same shape lightningcss-wasm emits.
lightningcss = { version = "=1.0.0-alpha.72", features = ["serde"] }
# wasmbuild pins the wasm-bindgen CLI; the crate dep must match (as @denext/photon does).
wasm-bindgen = "=0.2.108"
serde = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
# ahash pulls getrandom 0.3 transitively; on wasm32 it needs the JS entropy
# backend (the `wasm_js` feature + `--cfg getrandom_backend="wasm_js"`, set in
# the build below / .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }
